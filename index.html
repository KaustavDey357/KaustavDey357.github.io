<title>Kaustav Dey – DevOps &amp; Cloud Specialist</title>

<style>
  /* ---------- Tokens ---------- */
  :root {
    color-scheme: light;
    --bg: #eef7f1;
    --surface: #ffffff;
    --surface-2: #e2f1e8;
    --text: #0d2a20;
    --muted: #4b6b5d;
    --line: #c5dfd0;
    --accent: #15803d;
    --accent-2: #0e7490;
    --on-accent: #ffffff;
    --spot: rgba(21, 128, 61, 0.16);
    --dot: #bcd9c6;
    --dot-hot: #15803d;
    --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #08231c;
      --surface: #0d3026;
      --surface-2: #12402f;
      --text: #e8f6ee;
      --muted: #93b8a7;
      --line: #1d4b3c;
      --accent: #6ee7a8;
      --accent-2: #67e8f9;
      --on-accent: #06231a;
      --spot: rgba(110, 231, 168, 0.15);
      --dot: #14493b;
      --dot-hot: #6ee7a8;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #08231c;
    --surface: #0d3026;
    --surface-2: #12402f;
    --text: #e8f6ee;
    --muted: #93b8a7;
    --line: #1d4b3c;
    --accent: #6ee7a8;
    --accent-2: #67e8f9;
    --on-accent: #06231a;
    --spot: rgba(110, 231, 168, 0.15);
    --dot: #14493b;
    --dot-hot: #6ee7a8;
  }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-behavior: smooth; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: 1.05rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
  }
  img, svg { max-width: 100%; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 clamp(1.25rem, 4vw, 2.5rem); }
  h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.025em; }

  /* ---------- Hero ---------- */
  .hero { position: relative; overflow: hidden; min-height: min(100svh, 900px); display: flex; }
  .dotgrid {
    position: absolute; inset: 0;
    -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
  }
  .dotgrid canvas { display: block; width: 100%; height: 100%; }
  .hero-inner { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; padding-top: 1.5rem; padding-bottom: 6rem; }
  .topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .25rem 1.5rem; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 1.25rem; letter-spacing: -0.01em; }
  .role { color: var(--muted); font-weight: 500; }
  .hero-main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-top: 3rem; }
  .hero-title {
    font-size: clamp(2.4rem, 5.8vw, 5rem);
    line-height: 1.02;
    font-weight: 700;
    letter-spacing: -0.035em;
    max-width: 12em;
  }
  .lead { max-width: 34rem; margin: 1.75rem 0 0; font-size: clamp(1.05rem, 2vw, 1.3rem); color: var(--muted); }
  .cta { display: flex; flex-wrap: wrap; gap: .75rem 1rem; margin-top: 2.25rem; }
  .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; animation-delay: .95s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .btn {
    display: inline-flex; align-items: center; gap: .55rem;
    padding: .85rem 1.5rem; border-radius: 999px;
    font-weight: 600; font-size: 1rem; text-decoration: none;
    border: 1px solid var(--line);
    transition: background .2s, border-color .2s, color .2s;
  }
  .btn svg { width: 1.1em; height: 1.1em; }
  .btn-primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; color: var(--text); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-lg { font-family: var(--display); font-size: clamp(1.05rem, 3.4vw, 1.5rem); padding: 1rem 1.9rem; letter-spacing: -0.01em; overflow-wrap: anywhere; }

  /* ---------- React Bits-style text effects ---------- */
  .bt-seg { display: inline-block; opacity: 0; filter: blur(12px); transform: translateY(-.35em);
    transition: opacity .8s ease, filter .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
  .bt-seg.in { opacity: 1; filter: blur(0); transform: none; }

  .shiny {
    color: transparent;
    background: linear-gradient(110deg, var(--text) 42%, var(--accent) 50%, var(--text) 58%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text;
    animation: shine 3.6s linear infinite;
  }
  @keyframes shine { from { background-position: 150% 0; } to { background-position: -50% 0; } }

  .gradient {
    color: transparent;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    animation: drift 7s linear infinite;
  }
  @keyframes drift { to { background-position: -200% 0; } }

  .decrypt { position: relative; display: inline-block; }
  .decrypt-sizer { visibility: hidden; }
  .decrypt-live { position: absolute; left: 0; top: 0; white-space: nowrap; }

  /* ---------- Marquee (ScrollVelocity) ---------- */
  .marquee { overflow: hidden; border-block: 1px solid var(--line); padding: 1.15rem 0; white-space: nowrap; }
  .track { display: inline-flex; will-change: transform; }
  .mq-group { display: inline-flex; }
  .mq-item {
    display: inline-flex; align-items: center; gap: 2.4rem; padding-right: 2.4rem;
    font-family: var(--display); font-weight: 600; letter-spacing: -0.02em;
    font-size: clamp(1.4rem, 3vw, 2.1rem); color: var(--muted);
  }
  .mq-item::after { content: ''; width: .5rem; height: .5rem; background: var(--accent); transform: rotate(45deg); flex: none; }
  .marquee.static { white-space: normal; }
  .marquee.static .track { flex-wrap: wrap; }
  .marquee.static .mq-group { flex-wrap: wrap; }

  /* ---------- Sections ---------- */
  .block { padding-top: clamp(4rem, 9vw, 7rem); }
  .block h2 { font-size: clamp(2rem, 4.4vw, 3.2rem); font-weight: 700; margin-bottom: 2rem; }

  /* ---------- Spotlight / tilt cards ---------- */
  .spot {
    position: relative; isolation: isolate; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; padding: 1.6rem;
    text-decoration: none; color: inherit; display: block;
  }
  .spot::before {
    content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), var(--spot), transparent 60%);
    opacity: 0; transition: opacity .3s;
  }
  .spot:hover::before { opacity: 1; }
  .spot.tilt { transition: transform .2s ease-out, border-color .2s; will-change: transform; }
  .spot.tilt:hover { border-color: var(--accent); }

  .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 1.25rem; }
  .service h3 { font-size: 1.4rem; font-weight: 650; margin-bottom: .6rem; }
  .service p { margin: 0; color: var(--muted); }
  .service .ico { width: 2.75rem; height: 2.75rem; display: grid; place-items: center; border-radius: 12px; background: var(--surface-2); color: var(--accent); margin-bottom: 1.1rem; }
  .service .ico svg { width: 55%; height: 55%; }

  .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 1.25rem; }
  .project { display: flex; flex-direction: column; gap: .75rem; }
  .project h3 { font-size: 1.45rem; font-weight: 650; }
  .project p { margin: 0; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: auto; padding-top: .5rem; }
  .tag { font-size: .82rem; padding: .15rem .7rem; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--bg); }
  .repo { display: inline-flex; align-items: center; gap: .4rem; font-weight: 600; color: var(--accent); }
  .repo svg { width: 1em; height: 1em; }

  /* ---------- Featured: LeadsExpo ---------- */
  .block.lead-block { padding-top: clamp(2.5rem, 6vw, 4.5rem); padding-bottom: clamp(1rem, 3vw, 2rem); }
  .feature {
    display: grid; grid-template-columns: 1.1fr 1fr; gap: 2rem clamp(2rem, 5vw, 4rem);
    padding: clamp(1.5rem, 4vw, 2.75rem);
    border-color: var(--accent); border-radius: 26px;
  }
  .feature-main { display: flex; flex-direction: column; align-items: flex-start; }
  .badge { display: inline-block; padding: .15rem .75rem; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: .8rem; font-weight: 600; margin-bottom: 1rem; }
  .block .feature-title { font-size: clamp(2.6rem, 7vw, 4.6rem); line-height: 1; letter-spacing: -0.035em; margin-bottom: 1.1rem; }
  .feature-tagline { font-size: clamp(1.1rem, 2.2vw, 1.4rem); margin: 0 0 1rem; max-width: 30rem; }
  .feature-note { margin: 0 0 1.25rem; color: var(--muted); max-width: 30rem; }
  .feature .tags { margin-top: 0; padding-top: 0; margin-bottom: 1.75rem; }
  .feature-points { display: flex; flex-direction: column; gap: 1.5rem; justify-content: center; }
  .point { border-left: 2px solid var(--accent); padding-left: 1.1rem; }
  .point h3 { font-size: 1.25rem; font-weight: 650; margin-bottom: .25rem; }
  .point p { margin: 0; color: var(--muted); }
  @media (max-width: 820px) { .feature { grid-template-columns: 1fr; } }

  /* ---------- Blog ---------- */
  .posts { border-top: 1px solid var(--line); }
  .post {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .4rem 2rem;
    padding: 1.4rem 0; border-bottom: 1px solid var(--line); text-decoration: none;

  .post-title { font-family: var(--display); font-size: clamp(1.15rem, 2.4vw, 1.6rem); font-weight: 600; letter-spacing: -0.02em; max-width: 40rem; transition: color .2s; }
  .post-src { display: inline-flex; align-items: center; gap: .35rem; color: var(--muted); font-size: .95rem; transition: color .2s; }
  .post-src svg { width: 1em; height: 1em; }
  .post:hover .post-title, .post:hover .post-src { color: var(--accent); }

  /* ---------- Contact ---------- */
  .contact h2 { font-size: clamp(2.2rem, 6vw, 4.5rem); line-height: 1.05; letter-spacing: -0.03em; max-width: 12em; margin-bottom: 2.25rem; }
  .links { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; margin-top: 2rem; }
  .links a { color: var(--muted); font-weight: 500; text-underline-offset: 4px; }
  .links a:hover { color: var(--accent); }

  footer { padding: 5rem 0 7.5rem; color: var(--muted); font-size: .95rem; }
  .divider { border-top: 1px solid var(--line); padding-top: 1.5rem; }

  /* ---------- Dock ---------- */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; justify-content: center; pointer-events: none; padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 12px); }
  .dock-panel {
    pointer-events: auto; display: flex; align-items: flex-end; gap: 10px;
    height: 60px; padding: 8px; border-radius: 20px;
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .16);
  }
  .dock-item {
    position: relative; flex: none; display: grid; place-items: center;
    width: 44px; height: 44px; border-radius: 14px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    text-decoration: none; transition: width .12s ease-out, height .12s ease-out, color .2s;
  }
  button.dock-item { padding: 0; font: inherit; cursor: pointer; }
  .dock-item:hover { color: var(--accent); }
  .dock-item svg { width: 46%; height: 46%; }
  .dock-label {
    position: absolute; bottom: calc(100% + 10px); left: 50%;
    transform: translateX(-50%) translateY(4px);
    opacity: 0; pointer-events: none; white-space: nowrap;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    padding: .2rem .6rem; border-radius: 8px; font-size: .8rem;
    transition: opacity .15s, transform .15s;
  }
  .dock-item:hover .dock-label, .dock-item:focus-visible .dock-label { opacity: 1; transform: translateX(-50%); }

  /* ---------- Fallback ---------- */
  .fallback { padding: 2rem; max-width: 40rem; margin: 0 auto; }

  /* ---------- Motion preferences ---------- */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .rise, .shiny, .gradient { animation: none; }
    .bt-seg { transition: none; }
    .spot.tilt, .dock-item { transition: none; }
  }
</style>
